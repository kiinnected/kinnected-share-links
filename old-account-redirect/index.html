<!DOCTYPE html>
<!--
  Put this file (as index.html, and a copy as invite/index.html) in the OLD
  mirza-asjad/kinnected-share-links repo after the site has moved. It forwards
  invites that were already sent to the new kiinnected.github.io site, keeping
  the ?invite= / ?id= / ?code= query and any /invite/<id> path.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiinnected</title>
    <script>
        (function () {
            var base = 'https://kiinnected.github.io/kinnected-share-links';
            var path = window.location.pathname.replace(/^\/kinnected-share-links/, '');
            window.location.replace(base + path + window.location.search + window.location.hash);
        })();
    </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 40px 16px;">
    <p>Kiinnected has moved. Redirecting&hellip;</p>
    <p><a href="https://kiinnected.github.io/kinnected-share-links/">Continue to Kiinnected</a></p>
</body>
</html>
